<!DOCTYPE html>
  <html>

   <head>
           <title> Fixed Contact Widget </title>

    <style>

        body{

             font-family: Arial;
             margin: 0;
             padding: 20px;
        }

        h1{

             text-align: center;
        }

        .content{

             height: 1500px;
        }

        .contact-widget{


             position: fixed;
             bottom: 15px;
             right: 15px;
             background-color: lightblue;
             border: 2px solid black;
             padding: 12px;

            z-index:10;
        }

        .contact-widget:hover{

             background-color: lightgreen;
        }

    </style>

  </head>

<body>

    <h1> Company Website </h1>

    <div class="content">

        <p>Welcome to our company website.</p>

        <p>Please scroll down to see the fixed contact widget.</p>
    </div>

    <div class="contact-widget">

        <h3> Contact Us </h3>

        <p> Phone: +8801737731644 </p>

        <p> Email:
            <a href="mailto:info@company.com">info@company.com </a>
        </p>

    </div>
 </body>
</html>
