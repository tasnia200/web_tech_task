<!DOCTYPE html>
 <html>

  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Product Information Box </title>

    <style>

        body{ 
             
             margin:0;
             padding:20px;
             font-family:Arial, sans-serif;
             background-color:#f2f2f2;
             text-align:center;
        }

        .product{

             display:inline-block;
             width:220px;
             padding:15px;
             margin:15px;
             border:2px solid gray;
             background-color:white;
             text-align:center;
        }

        .product img{

             width:150px;
             height:120px;
        }

        .product:hover{
            
             outline:3px solid blue;
             outline-offset:5px;
        }

        .product a{

             text-decoration:none;
             color:white;
             background-color:green;
             padding:8px 15px;
             display:inline-block;
             margin-top:10px;
        }

    </style>

 </head>

<body>

    <h1>Our Products</h1>

    <div class="product">

        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300" alt="Laptop">

        <h2> Laptop </h2>

        <p> Powerful laptop for study and office work. </p>

        <h3> Price: $800 </h3>

        <a href="#"> Buy Now </a>

    </div>

    <div class="product">

        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" alt="Headphones">

        <h2> Headphones </h2>

        <p> Wireless headphones with clear sound quality. </p>

        <h3> Price: $120 </h3>

        <a href="#">Buy Now </a>

    </div>

    <div class="product">

        <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300" alt="Smartwatch">

        <h2> Smartwatch </h2>

        <p> Smartwatch with fitness and health tracking. </p>

        <h3> Price: $250 </h3>

        <a href="#">Buy Now </a>

    </div>

</body>

</html>
