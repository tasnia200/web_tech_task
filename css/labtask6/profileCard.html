<!DOCTYPE html>
 <html>

  <head>
         <title> Profile Card </title>

    <style>

        body{

             margin:0;
             padding:30px;
             font-family:Arial;
             background-color:#f2f2f2;
             text-align:center;
        }

        .card{

             width:280px;
             margin:auto;
             padding:20px;
             border:2px solid gray;
             background-color:white;
             border-radius:12px;
             position:relative;
             box-shadow:3px 3px 8px lightgray;
        }

        .card img{

             width:120px;
             height:120px;
             border-radius:50%;
        }

        .badge{

             position:absolute;
             top:10px;
             right:10px;
             background-color:green;
            color:white;
             padding:5px 10px;
             border-radius:15px;
             font-size:14px;
        }

        h2{

             margin-top:15px;
        }

        p{

             color:#555;
        }

    </style>

 </head>
<body>

    <div class="card">

        <div class="badge"> Online </div>

        <img src="https://www.svgrepo.com/show/382095/female-avatar-girl-face-woman-user-4.svg" alt="profile">
        <h2> Tasnia Mamun </h2>

        <p> I am a Computer Science and Engineering student. 
            I enjoy learning web development and programming. 
        </p>

    </div>

</body>
</html>
