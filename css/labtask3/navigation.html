<!DOCTYPE html>
 <html>

  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Navigation Bar </title>

    <style>

        body{

             margin:0;
             font-family:Arial, sans-serif;
        }

        nav{

              background-color:#006699;
              width:100%;
              text-align:center;
              padding:18px;
        }

        nav a{

             display:inline-block;
             text-decoration:none;
             color:white;
             padding:12px 18px;
             margin:8px;
        }

        nav a:hover{

             background-color:orange;
             color:black;
             border-radius:5px;
        }

    </style>

</head>
 <body>

    <nav>

        <a href="#"> Home </a>

        <a href="#"> About </a>

        <a href="#"> Services </a>

        <a href="#"> Gallery </a>

        <a href="#"> Contact </a>

    </nav>

</body>

</html>
